<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
      section { padding: 16px 20px; }
      .light { background: #fff; color: #111; }
      .dark { background: #16171d; color: #eee; }
      h4 { margin: 6px 0 10px; font-size: 12px; font-weight: 600; opacity: .6; }
      .row { display: flex; align-items: flex-end; gap: 24px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; opacity: .75; }
      img { display: block; }
    </style>
  </head>
  <body>
    <section class="light">
      <h4>LIGHT — tsdml.svg at 64 / 28 / 18px</h4>
      <div class="row">
        <div class="cell"><img src="tsdml.svg" width="64" height="64" /><span>64</span></div>
        <div class="cell"><img src="tsdml.svg" width="28" height="28" /><span>28 (hero)</span></div>
        <div class="cell"><img src="tsdml.svg" width="18" height="18" /><span>18 (link)</span></div>
        <div class="cell"><img src="tsdml-dark.svg" width="64" height="64" /><span>dark variant</span></div>
      </div>
    </section>
    <section class="dark">
      <h4>DARK — tsdml.svg at 64 / 28 / 18px</h4>
      <div class="row">
        <div class="cell"><img src="tsdml.svg" width="64" height="64" /><span>64</span></div>
        <div class="cell"><img src="tsdml.svg" width="28" height="28" /><span>28 (hero)</span></div>
        <div class="cell"><img src="tsdml.svg" width="18" height="18" /><span>18 (link)</span></div>
        <div class="cell"><img src="tsdml-dark.svg" width="64" height="64" /><span>dark variant</span></div>
      </div>
    </section>
  </body>
</html>
