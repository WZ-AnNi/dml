[workspace]
resolver = "3"
members = [
  "crates/dml-ast",
  "crates/dml-parser",
  "crates/dml-codegen",
  "crates/dml-lsp",
  "crates/napi-binding",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "TSDML native compiler workspace: DML parser → DML-AST → codegen → LSP."

[workspace.dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
